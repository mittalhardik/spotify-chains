<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>Spotify Chains</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#161616; --muted:#6b6b6b; --accent:#128a3e; --accent-ink:#fff; --line:#e3e3df; --danger:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --card:#1c1c1c; --text:#f2f2f2; --muted:#a0a0a0; --accent:#1ed760; --accent-ink:#000; --line:#2b2b2b; --danger:#ff6b5f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 16px; }
  .error { color:var(--danger); }
  .btn { display:block; text-align:center; text-decoration:none; margin-top:8px; font-weight:650; padding:13px; border-radius:999px; background:var(--accent); color:var(--accent-ink); }
  .small { font-size:13px; margin:16px 0 0; }
</style>
</head>
<body>
<main class="card">
  <h1>Spotify Chains</h1>
  <p>Turns the songs that keep playing without you picking anything into Spotify playlists.</p>
  {{ERROR}}
  <a class="btn" href="/auth/login">Sign in with Spotify</a>
  <p class="small">Up to 5 people can use this app; the owner adds your Spotify email first.</p>
</main>
</body>
</html>
